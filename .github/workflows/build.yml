
          

name: Build Crazy Aim APK

      - name: Build APK
        shell: bash
        run: |
          echo "Files extracted:"
          find project -maxdepth 4 -type f | head -80
          echo "Checking Gradle project:"
          find project -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \)
          gradle -p project assembleDebug --stacktrace --info
          

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip CrazyAimAutoPlayer-AndroidStudio-Source.zip -d project

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CrazyAim-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
