
name: Build Crazy Aim APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: List repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f | head -100

      - name: Check ZIP exists
        run: test -f CrazyAimAutoPlayer-AndroidStudio-Source.zip

      - name: Extract project
        run: |
          mkdir project
          unzip CrazyAimAutoPlayer-AndroidStudio-Source.zip -d project

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          find project -type f \( -name settings.gradle -o -name settings.gradle.kts \)
          gradle -p project assembleDebug --stacktrace
